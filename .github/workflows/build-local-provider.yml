name: Build Local Provider

on:
  workflow_dispatch:
  push:
    branches: [add-local-provider]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: add-local-provider

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun turbo build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-local-provider
          path: |
            packages/app/dist/opencode.exe
            packages/app/dist/opencode
          retention-days: 30